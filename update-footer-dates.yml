name: Atualizar data do rodapé nas páginas principais

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sobre.html'
      - 'estante.html'
      - 'historico.html'
      - 'desafio.html'
      - '2026.html'

permissions:
  contents: write

jobs:
  atualizar-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar script de atualização de data
        run: node scripts/update-footer-dates.js

      - name: Commitar e publicar mudanças (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sobre.html estante.html historico.html desafio.html 2026.html
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Atualiza data do rodapé (automático)"
            git push
          fi
