name: Atualizar dados do HISTÓRICO

on:
  schedule:
    - cron: '0 12 * * *'   # todo dia às 12h UTC (~9h Brasília), depois da Estante
  workflow_dispatch:        # permite rodar manualmente pelo botão

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-historico.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico-visao-geral.json
          git diff --staged --quiet || git commit -m "Atualiza dados do HISTÓRICO"
          git push
