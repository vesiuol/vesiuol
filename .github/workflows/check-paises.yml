name: Conferir países (Notion × planilhas × mapas)

on:
  schedule:
    - cron: '30 13 * * *'   # todo dia às 13h30 UTC (~10h30 Brasília), depois de todos os workflows de dados (9h–12h UTC)
  workflow_dispatch:         # permite rodar manualmente pelo botão
  push:
    branches: [main]
    paths:
      - 'assets/paises.js'
      - 'scripts/check-paises.js'
      - '.github/workflows/check-paises.yml'

permissions:
  contents: read             # só lê o repositório — este workflow nunca commita nada

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-paises.js   # relatório aparece na aba "Summary" da execução; fica vermelho se houver país desconhecido
