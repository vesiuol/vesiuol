name: Gerar posts do blog a partir do Notion

on:
  schedule:
    # 9h UTC = 6h em Brasília (horário padrão, sem horário de verão)
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: o sync-partials usa "git log" por arquivo para a data do rodapé

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar gerador de posts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DB_ID: ${{ secrets.NOTION_BLOG_DB_ID }}
        run: node scripts/generate-blog-posts.js

      # Push feito pelo bot (GITHUB_TOKEN) NÃO dispara outros workflows, então o
      # sync-partials precisa rodar aqui dentro, antes do commit. Assim todo post
      # novo já nasce com nav, rodapé e GTM atualizados.
      - name: Sincronizar cabeçalho/rodapé nos posts
        run: node scripts/sync-partials.js

      - name: Commitar e publicar mudanças (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ data/blog-posts.json sitemap.xml
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Publica post(s) novo(s) do blog via Notion"
            git push
          fi
